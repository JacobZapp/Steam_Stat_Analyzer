<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Steam Stat Analyzer</title>
</head>

<body>
    <h1>Steam Stat Analyzer</h1>

    <h2>Login</h2>

    {% if form.errors %}
        <p>Username or password was incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'signup' %}">
            Create one
        </a>
    </p>
</body>
</html>
